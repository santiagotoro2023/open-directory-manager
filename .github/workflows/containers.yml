# Docker images and the Helm chart (docs/CONTAINERS.md).
#
# Every push and pull request: the chart (helm lint, every rendered resource
# against the Kubernetes schema), the plain manifest generated from it, the
# Compose files, both images built, and a whole domain brought up from them
# with Compose and tested end to end.
#
# Pushes to main, tags v* and a run with a version then publish to the
# GitHub Container Registry, for amd64 and arm64:
#   ghcr.io/<owner>/open-directory-manager:<version>        the control plane
#   ghcr.io/<owner>/open-directory-manager-node:<version>   controllers and role servers
#   oci://ghcr.io/<owner>/charts/open-directory-manager     the Helm chart
# The version comes from api/pyproject.toml, the one every component carries.
name: Containers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBERNETES_VERSION: 1.31.0
  HELM_VERSION: v3.16.4
  KUBECONFORM_VERSION: v0.6.7

jobs:
  chart:
    name: chart, manifest and compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz kubeconform
      - name: Helm chart
        run: |
          helm lint --strict deploy/helm/open-directory-manager
          # Every optional part on, with more machines than the default.
          helm template t deploy/helm/open-directory-manager \
            --set ingress.enabled=true --set autoscaling.enabled=true --set networkPolicy.enabled=true \
            --set 'domainControllers[1].node=dc2' --set 'domainControllers[1].address=192.0.2.12' \
            --set 'memberServers[0].node=srv1' --set 'memberServers[0].address=192.0.2.21' \
            --set nodes.joinToken=example \
            | ./kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION"
          helm template t deploy/helm/open-directory-manager --set database.bundled.enabled=false \
            --set database.url=postgresql://odm:pw@db.example.org/odm --set ntfy.enabled=false \
            | ./kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION"
      - name: The plain manifest is the chart's (generate.sh, committed)
        run: |
          deploy/kubernetes/generate.sh
          git diff --exit-code deploy/kubernetes || {
            echo "::error::Run deploy/kubernetes/generate.sh and commit the result"; exit 1; }
          ./kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            deploy/kubernetes/open-directory-manager.yaml
      - name: Compose files
        run: |
          cp deploy/compose/.env.example .env
          sed -i 's/^ODM_ADMIN_PASSWORD=$/ODM_ADMIN_PASSWORD=x/; s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=x/' .env
          docker compose config -q
          cp deploy/compose/node/.env.example deploy/compose/node/.env
          docker compose -f deploy/compose/node/docker-compose.yml \
            --env-file deploy/compose/node/.env config -q
      - name: Image scripts
        run: |
          for f in deploy/docker/*/odm-* scripts/test-containers.sh deploy/kubernetes/generate.sh; do
            echo "-- $f"; bash -n "$f"
          done

  e2e:
    name: a domain from the images (compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the control plane
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/santiagotoro2023/open-directory-manager:latest
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,scope=control-plane,mode=max
      - name: Build the node
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/node/Dockerfile
          load: true
          tags: ghcr.io/santiagotoro2023/open-directory-manager-node:latest
          cache-from: type=gha,scope=node
          cache-to: type=gha,scope=node,mode=max
      - name: PostgreSQL for the stack
        run: docker pull postgres:17-alpine
      - name: Provision a domain and test it
        run: scripts/test-containers.sh

  publish:
    name: publish images and chart
    if: github.event_name != 'pull_request'
    needs: [chart, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' api/pyproject.toml)"
          grep -q "^appVersion: \"$VERSION\"" deploy/helm/open-directory-manager/Chart.yaml || {
            echo "::error::Chart.yaml does not say $VERSION; run scripts/bump-version.sh"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.v.outputs.owner }}/open-directory-manager
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - id: meta-node
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.v.outputs.owner }}/open-directory-manager-node
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: Control plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,scope=control-plane,mode=max
      - name: Node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta-node.outputs.tags }}
          labels: ${{ steps.meta-node.outputs.labels }}
          cache-from: type=gha,scope=node
          cache-to: type=gha,scope=node,mode=max
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Helm chart
        env:
          VERSION: ${{ steps.v.outputs.version }}
          OWNER: ${{ steps.v.outputs.owner }}
        run: |
          helm lint --strict deploy/helm/open-directory-manager
          helm package deploy/helm/open-directory-manager --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "open-directory-manager-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"
