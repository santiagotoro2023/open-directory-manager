name: CI

on:
  push:
    branches: [main]
    # A tag is what publishes the client package; without this the release
    # job below could never run.
    tags: ["v*"]
  pull_request:
  # The other way to publish one: run the workflow and name the version. The
  # release job creates the tag from the commit it ran on, so a release can be
  # cut from anywhere the Actions tab is reachable rather than only from a
  # shell holding a push credential for tags.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.6.0. Empty runs the checks only."
        required: false
        default: ""

permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  api:
    name: api (lint + test)
    runs-on: ubuntu-latest
    # The suite fakes the pool, so a query can be wrong in a way only
    # PostgreSQL reports. A real one runs the integration tests against the
    # actual schema.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Kerberos/SASL headers
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libsasl2-dev
      - name: Install
        working-directory: api
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: api
        run: ruff check .
      - name: Test
        working-directory: api
        env:
          ODM_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
        run: pytest -q
      - name: Fail if the database tests were skipped
        working-directory: api
        env:
          ODM_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
        # Explicit, so pipefail is set: these pipe into tee, and without it the
        # exit status would be tee's.
        shell: bash
        run: |
          # A silently skipped integration suite is the same as not having one,
          # and with a database configured none of it has any reason to skip.
          result="${RUNNER_TEMP:-/tmp}/integration.txt"
          pytest tests/test_integration_db.py -q --no-header -rs 2>&1 | tee "$result"
          if grep -q "skipped" "$result"; then
            echo "the database tests skipped despite a database being configured" >&2
            exit 1
          fi
          grep -qE "[0-9]+ passed" "$result"

  installed:
    name: installed package (not the source tree)
    runs-on: ubuntu-latest
    # Two bugs reached a real install because the package and the source tree
    # are not the same thing: migrations that were never packaged, and a path
    # that resolved differently once installed. This job runs from an install.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Kerberos/SASL headers
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libsasl2-dev
      - name: Install the package, not the working tree
        working-directory: api
        run: pip install .
      - name: Migrate from the installed copy, outside the source tree
        env:
          ODM_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
          ODM_REALM: corp.example.internal
          ODM_DOMAIN: corp.example.internal
          ODM_LDAP_URI: ldaps://dc1.corp.example.internal
          ODM_LDAP_CA_CERT: /nonexistent/ca.pem
        shell: bash
        run: |
          # / is not writable by the runner, so keep the output elsewhere.
          applied="${RUNNER_TEMP:-/tmp}/applied.txt"
          # Run from / so nothing can resolve a path relative to the checkout.
          cd /
          odm-db migrate | tee "$applied"
          # An install that finds no migrations used to print exactly this.
          if grep -q "no pending migrations" "$applied"; then
            echo "the installed package shipped no migrations" >&2
            exit 1
          fi
          test "$(grep -c '\.sql$' "$applied")" -ge 10
      - name: The console must be servable from the installed copy
        env:
          ODM_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
          ODM_REALM: corp.example.internal
          ODM_DOMAIN: corp.example.internal
          ODM_LDAP_URI: ldaps://dc1.corp.example.internal
          ODM_LDAP_CA_CERT: /nonexistent/ca.pem
        run: |
          cd /
          python -c "
          from odm.main import app
          paths = {getattr(r, 'path', None) for r in app.routes}
          assert '/api/v1/healthz' in paths, sorted(p for p in paths if p)
          print('installed app imports,', len(app.routes), 'routes')
          "

  web:
    name: web (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build

  go:
    name: ${{ matrix.module }} (vet + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [agent, client-join]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

  deploy:
    name: deploy scripts (syntax + uninstall coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every script
        run: |
          shopt -s nullglob
          for f in deploy/*.sh; do
            echo "-- $f"
            bash -n "$f"
          done
          # Not every script under deploy/ is shell. The import helper runs on
          # a freshly provisioned controller, with nothing installed but the
          # system Python, so it is checked the same way the shell ones are.
          for f in deploy/*.py; do
            echo "-- $f"
            python3 -m py_compile "$f"
          done
      # deploy/uninstall.sh must be able to remove whatever a role installer
      # puts on a machine. This fails the build the moment a new
      # install-*-role.sh ships without a matching teardown, rather than
      # leaving that for whoever next has to hand-uninstall a stale lab box.
      - name: Every role installer has a matching uninstall
        run: deploy/uninstall.sh --check-roles

  dependency-scan:
    name: dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: pip-audit
        working-directory: api
        run: |
          sudo apt-get update && sudo apt-get install -y libkrb5-dev libsasl2-dev
          pip install pip-audit==2.7.3
          pip install .
          # Audit the resolved dependency set; odm-api is this repo, not a
          # PyPI distribution, so it is excluded rather than looked up.
          pip freeze --exclude odm-api > /tmp/resolved-requirements.txt
          pip-audit --strict --no-deps -r /tmp/resolved-requirements.txt
      - name: npm audit
        working-directory: web
        run: npm install --no-audit --no-fund && npm audit --audit-level=high
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for m in agent client-join; do (cd "$m" && "$(go env GOPATH)/bin/govulncheck" ./...); done

  client-package:
    name: odm-client.deb
    runs-on: ubuntu-latest
    # A machine being joined has no reason to have a checkout on it. One file
    # to download, open and join with — built on every change, so what is
    # published is never older than the code.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build the package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # The version comes from the tag when there is one, or from the
          # version the run was given, so a release is not a separate thing
          # anyone has to remember to bump.
          VERSION="0.1.$(git rev-list --count HEAD)"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${RELEASE_VERSION:-}" ]; then
            VERSION="${RELEASE_VERSION#v}"
          fi
          echo "ODM_CLIENT_VERSION=$VERSION" >> "$GITHUB_ENV"
          bash packaging/deb/build.sh "$VERSION"
      - name: The package must contain what a machine needs to join and apply
        shell: bash
        run: |
          set -o pipefail
          PACKAGE="dist/odm-client_${ODM_CLIENT_VERSION}_amd64.deb"
          dpkg-deb --contents "$PACKAGE" | tee /tmp/contents.txt
          # odm-agent and its unit because the join's last step enables it;
          # the role installers because a member server is given a role by
          # its own agent running one.
          for path in ./usr/sbin/odm-client-install \
                      ./usr/sbin/odm-agent \
                      ./lib/systemd/system/odm-agent.service \
                      ./usr/lib/odm/roles/install-dhcp-role.sh \
                      ./usr/lib/odm/roles/odm-role-common.sh; do
            grep -q "$path" /tmp/contents.txt || { echo "missing $path" >&2; exit 1; }
          done
      - name: It must install, run and uninstall cleanly
        run: |
          # The runner image ships a package index baked hours or days ago,
          # and the archive prunes superseded builds on its own schedule, so
          # an install against that index reaches for filenames the mirror no
          # longer has and dies on 404. This job used to refresh it by
          # accident — the step that installed the desktop toolkit headers ran
          # apt-get update first — and removing that step with the desktop
          # application removed the refresh with it.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "./dist/odm-client_${ODM_CLIENT_VERSION}_amd64.deb"
          odm-client-install --version
          odm-agent --version
          for BINARY in /usr/sbin/odm-client-install /usr/sbin/odm-agent; do
            if ldd "$BINARY" | grep "not found"; then
              echo "$BINARY has unresolved libraries" >&2
              exit 1
            fi
          done
          sudo apt-get remove -y odm-client
          test ! -e /usr/sbin/odm-client-install
      - uses: actions/upload-artifact@v4
        with:
          name: odm-client-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: publish odm-client.deb
    needs: [api, installed, web, go, client-package]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # A release names a version; the tree has to be that version already.
      # Publishing 0.7.0 from a tree that says 0.6.0 gives every client a
      # package whose --version disagrees with the release it came from.
      - name: The version released is the version in the tree
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            VERSION="${RELEASE_VERSION#v}"
          fi
          for file in api/pyproject.toml agent/main.go web/package.json \
                      client-join/cmd/odm-client-install/main.go; do
            grep -q "\"$VERSION\"" "$file" || {
              echo "$file does not say $VERSION; bump the version first" >&2
              exit 1
            }
          done
          # The tag comes from the same stripped value, so a run given
          # "v0.8.0" and one given "0.8.0" produce one tag rather than
          # v0.8.0 and vv0.8.0.
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: odm-client-deb
          path: dist
      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag, the tag that was pushed. On a run given a version, the
          # tag is created here from the commit the run checked out — named
          # from the version the step above verified, with exactly one "v".
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.deb
          fail_on_unmatched_files: true
          # Whoever downloads this is standing at a machine they want joined,
          # not reading the repository.
          body: |
            Download `odm-client_*.deb` and run one command.

            ```
            sudo apt update
            sudo apt install ./odm-client_*.deb
            sudo odm-client-install --domain corp.example.internal --admin-user Administrator
            ```

            The command finds the domain by its service records, joins it,
            installs the machine keytab and starts the policy agent. Anything
            omitted is prompted for; add `--otp <token>` for scripted
            provisioning. Joining needs root; leaving needs a domain credential
            or `--force` as root.

            Debian 12 and 13, amd64.
