name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  api:
    name: api (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Kerberos/SASL headers
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libsasl2-dev
      - name: Install
        working-directory: api
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: api
        run: ruff check .
      - name: Test
        working-directory: api
        run: pytest -q

  web:
    name: web (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build

  go:
    name: ${{ matrix.module }} (vet + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [agent, client-join]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  dependency-scan:
    name: dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: pip-audit
        working-directory: api
        run: |
          sudo apt-get update && sudo apt-get install -y libkrb5-dev libsasl2-dev
          pip install pip-audit==2.7.3
          pip install -e .
          pip-audit --strict
      - name: npm audit
        working-directory: web
        run: npm install --no-audit --no-fund && npm audit --audit-level=high
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for m in agent client-join; do (cd "$m" && "$(go env GOPATH)/bin/govulncheck" ./...); done
