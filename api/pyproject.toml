[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odm-api"
version = "0.6.0"
description = "Open Directory Manager control-plane API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Open Directory Manager Contributors", email = "hello@example.org" }]

# Pinned exactly — CLAUDE.md §6 requires pinned versions and dependency scanning.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "asyncpg==0.31.0",
    "ldap3==2.9.1",
    "gssapi==1.9.0",
    "defusedxml==0.7.1",
    "httpx==0.28.1",
    "cryptography==50.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
]

[project.scripts]
odm-db = "odm.db:main"

[tool.setuptools.packages.find]
include = ["odm*"]

[tool.setuptools.package-data]
odm = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom; not a mutable default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
