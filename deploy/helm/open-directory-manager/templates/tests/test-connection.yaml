apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "odm.fullname" . }}-test"
  labels:
    {{- include "odm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: healthz
      image: {{ include "odm.image" . }}
      command: ["curl", "-fsSk", "https://{{ include "odm.fullname" . }}:{{ .Values.console.port }}/api/v1/healthz"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
