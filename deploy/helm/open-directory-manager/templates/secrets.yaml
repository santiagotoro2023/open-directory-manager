{{- if not .Values.domain.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odm.fullname" . }}-admin
  labels:
    {{- include "odm.labels" . | nindent 4 }}
  annotations:
    # Never deleted by helm uninstall: it is the domain Administrator's password
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ include "odm.adminPassword" . | quote }}
---
{{- end }}
{{- if not .Values.database.existingSecret }}
{{- $pw := include "odm.dbPassword" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odm.fullname" . }}-db
  labels:
    {{- include "odm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if .Values.database.bundled.enabled }}
  password: {{ $pw | quote }}
  url: {{ printf "postgresql://odm:%s@%s-db:5432/odm" $pw (include "odm.fullname" .) | quote }}
  {{- else }}
  url: {{ required "database.url or database.existingSecret is needed when database.bundled.enabled is false" .Values.database.url | quote }}
  {{- end }}
{{- end }}
{{- if .Values.nodes.joinToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odm.fullname" . }}-join
  labels:
    {{- include "odm.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.nodes.joinToken | quote }}
{{- end }}
